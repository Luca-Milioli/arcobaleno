<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcobaleno dei super poteri</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: "Skyippy Sharp";
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @font-face {
            font-family: "Skyippy Sharp";
            src: url("../art/font/SkippySharp.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
        }

        .fruit-icon {
            height: 1em;             /* grandezza proporzionata al testo */
            vertical-align: middle;  /* allinea col testo */
            margin: 0 0.3em;         /* un po’ di spazio dal testo */
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: transparent !important;
            display: block;
            opacity: 0;
            transition: opacity 1s ease;
            outline: none !important; /* se non è messo a none, viene visualizzato un bordo quando si clicca sul canvas */
        }

        #canvas.ready {
            opacity: 1;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: #fff;
            text-align: center;
        }

        .overlay h1 {
            font-size: clamp(25px, 4vw, 100px);
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            color: black;
        }

        .loading {
            width: clamp(280px, 40vw, 1000px);
            height: 3vh;
            background: rgba(255,255,255,0.4);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #FF6B9D, #FFE066, #21d344);
            background-size: 300% 100%;
            animation: progressAnim 2s linear infinite;
            transition: width 0.3s ease;
        }

        @keyframes progressAnim {
            0% { background-position: 0% 0; }
            100% { background-position: 300% 0; }
        }

        .status {
            font-weight: bold;
            margin-top: 10px;
        }

        .status.error {
            color: #ff0000;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="overlay" id="overlay">
        <h1>
            <img src="../art/fruit/fragola.png" class="fruit-icon">
            Arcobaleno dei super poteri
            <img src="../art/fruit/albicocca.png" class="fruit-icon">
        </h1>
        <div class="loading">
            <div class="progress" id="progress"></div>
        </div>
        <div class="status" id="status"></div>
    </div>

    <script src="$GODOT_URL"></script>
    <script>
        const canvas = document.getElementById('canvas');
        const body = document.body;
        const overlay = document.getElementById('overlay');
        const progressBar = document.getElementById('progress');
        const statusDiv = document.getElementById('status');

        // Config base di Godot + canvas trasparente
        var config = Object.assign({}, $GODOT_CONFIG, {
            canvas: { alpha: true },
            pauseOnBlur: false // don't pause when you click outside the canvas (non sembra funzionare)
        });

        var engine = new Engine(config);

        engine.startGame({
            onProgress: function(current, total) {
                if (total > 0) {
                    const percent = (current / total) * 100;
                    progressBar.style.width = percent + "%";
                }
            }
        }).then(() => {
            overlay.style.display = 'none';
            canvas.classList.add('ready');
            body.classList.add('ready');
        }).catch(err => {
            statusDiv.textContent = "Errore: " + err;
            statusDiv.classList.add('error');
        });
        
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    console.log('Modalità schermo intero attivata');
                }).catch((err) => {
                    console.error('Impossibile attivare lo schermo intero:', err);
                });
            } else {
                document.exitFullscreen().then(() => {
                    console.log('Schermo intero disattivato');
                });
            }
        }

        // F11
        document.addEventListener('keydown', function(event) {
            if (event.key === 'F11') {
                event.preventDefault();
                toggleFullscreen();
            }
        });
    </script>
</body>
</html>
